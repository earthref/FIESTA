# Remote-data overlay: the local API and frontend against the Postgres,
# OpenSearch and S3 named in an env file (e.g. the dev deployment's), so local
# code sees real accounts and contributions.
#
#   make up ENV_FILE=.env.prod FIESTA_NODE=magic
#
# The Makefile adds this file and `--env-file <ENV_FILE>` (after `.env`) when
# ENV_FILE is set; a plain `make up` never reads it. Values below are compose
# interpolation from that file, so a `$` in a secret must be single-quoted there.
#
# Nothing here may change the remote schema or take its jobs: FIESTA_REMOTE
# makes the api skip `fiesta init` (this branch's migrations would run against
# the shared database), and the worker is not started (it would consume the
# deployment's queues with this branch's code). The local postgres/opensearch/
# rustfs containers still start but are unused.

x-remote-env: &remote-env
  FIESTA_REMOTE: "1"
  FIESTA_DATABASE_URL: ${FIESTA_DATABASE_URL:?ENV_FILE must set FIESTA_DATABASE_URL}
  FIESTA_DB_SHARED_SCHEMA: ${FIESTA_DB_SHARED_SCHEMA:-public}
  FIESTA_OPENSEARCH_URL: ${FIESTA_OPENSEARCH_URL:?ENV_FILE must set FIESTA_OPENSEARCH_URL}
  FIESTA_OPENSEARCH_VERIFY_CERTS: ${FIESTA_OPENSEARCH_VERIFY_CERTS:-true}
  # Mandatory on a shared cluster: the legacy apps own the plain index names.
  FIESTA_INDEX_PREFIX: ${FIESTA_INDEX_PREFIX:?ENV_FILE must set FIESTA_INDEX_PREFIX}
  FIESTA_S3_ENDPOINT: ${FIESTA_S3_ENDPOINT-}  # empty means AWS itself
  FIESTA_S3_ACCESS_KEY: ${FIESTA_S3_ACCESS_KEY:?ENV_FILE must set FIESTA_S3_ACCESS_KEY}
  FIESTA_S3_SECRET_KEY: ${FIESTA_S3_SECRET_KEY:?ENV_FILE must set FIESTA_S3_SECRET_KEY}
  FIESTA_S3_REGION: ${FIESTA_S3_REGION:-us-east-1}
  FIESTA_S3_BUCKET: ${FIESTA_S3_BUCKET:?ENV_FILE must set FIESTA_S3_BUCKET}

services:
  api:
    environment: *remote-env
  worker:
    profiles: [remote-disabled]
