name: CI

# Replaces the template-inherited test.yml / playwright.yml / smokeshow.yml,
# which referenced scripts and a `backend` compose service that no longer
# exist and only ever triggered on `master`.
#
# Everything here runs the same targets a developer runs locally (see the
# Makefile), so a green CI means `make lint`, `make test` and `make e2e` pass.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref; a new push cancels the in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: fiesta/backend

      - name: Lint
        run: uv run ruff check . ../../configurations/sources ../../configurations/plugins
        working-directory: fiesta/backend

      - name: Test
        run: uv run pytest -q
        working-directory: fiesta/backend

  frontend:
    name: Frontend (biome + tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: fiesta/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: fiesta/frontend

      - name: Lint
        run: npx biome check . ../../configurations/plugins
        working-directory: fiesta/frontend

      # `npm run build` is tsc (type-check) followed by the production build.
      - name: Type-check and build
        run: npm run build
        working-directory: fiesta/frontend

  config:
    name: Node configs load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: fiesta/backend

      # Every configurations/*.yaml must parse, its data model and vocabularies must
      # load, its hierarchy tables must exist, and its plugins must resolve.
      # This is the check that catches a broken node config before deploy.
      - name: Load every deployment config
        working-directory: fiesta/backend
        run: |
          uv run python - <<'PY'
          import sys
          from pathlib import Path
          from fiesta.nodeconfig import load_deployment
          from fiesta.plugins import active_plugins

          failed = False
          for path in sorted(Path("../../configurations").glob("*.yaml")):
              try:
                  for node in load_deployment(path).node_list:
                      for version in node.data_model.versions:
                          node.load_data_model(version)
                      node.load_controlled_vocabularies()
                      node.load_suggested_vocabularies()
                      for plugin in active_plugins(node):
                          plugin.frontend_config(node)
                  print(f"ok   {path.name}")
              except Exception as exc:  # noqa: BLE001 - report every bad config
                  failed = True
                  print(f"FAIL {path.name}: {exc}")
          sys.exit(1 if failed else 0)
          PY

  e2e:
    name: End-to-end (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # OpenSearch refuses to start below this; GitHub runners default lower.
      - name: Raise vm.max_map_count for OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start the stack (API + worker + MagIC frontend)
        run: make up FIESTA_NODE=magic PROD=1

      - name: Wait for the stack to become healthy
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/v2/health-check >/dev/null; then
              echo "stack is up"
              exit 0
            fi
            sleep 5
          done
          echo "stack did not become healthy in 5 minutes"
          exit 1

      - name: Run the end-to-end workflow test
        run: make e2e

      - name: Dump container logs
        if: failure()
        run: docker compose --project-directory . -f fiesta/docker-compose.yml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: make down

  integration:
    name: Integration (offline Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo sysctl -w vm.max_map_count=262144
      - run: make test-integration
      - run: make test-integration-restore
      - name: Logs
        if: failure()
        run: docker compose -p fiesta-integration-test --project-directory . -f fiesta/compose.integration-test.yml logs --no-color --tail 100
      - name: Tear down isolated stack
        if: always()
        run: docker compose -p fiesta-integration-test --project-directory . -f fiesta/compose.integration-test.yml down -v

  # Single required check for branch protection: green only if every job above
  # succeeded. Add this as the required status check when protecting `main`.
  ci:
    name: CI
    if: always()
    needs: [backend, frontend, config, e2e, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check that all jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"\(failure\|cancelled\)"'; then
            echo "one or more jobs failed"
            exit 1
          fi
