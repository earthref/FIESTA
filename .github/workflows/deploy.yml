name: Deploy

# Runs only after the CI workflow has succeeded on main -- a red e2e or
# Phase M Docker job must never reach production (the deploy script itself
# only re-runs the unit tests and the frontend build). Deliberately no
# pull_request trigger: this repo is public and the runner is self-hosted on
# the deploy host, so a workflow from a fork PR would execute untrusted code
# next to production credentials. workflow_run fires in the base repo's
# context, and the `branches` filter keeps it to CI runs whose head branch is
# main, i.e. pushes by accounts with write access. workflow_dispatch stays
# for manual rollouts.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Queue rather than cancel: a superseded run should still finish its release
# swap and restart instead of being killed mid-swap.
concurrency:
  group: deploy-fiesta
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, fiesta-deploy]
    timeout-minutes: 30
    steps:
      # No actions/checkout on purpose: deploy-fiesta.sh keeps its own clone
      # and builds a fresh release directory from origin/<branch>. It runs
      # ruff + pytest + the frontend type-check/build before anything is
      # swapped, and rolls back if a node fails its health check.
      - name: Pull, test, build, swap
        run: /srv/fiesta/bin/deploy-fiesta.sh "${{ github.event.workflow_run.head_branch || github.ref_name }}"
