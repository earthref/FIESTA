name: Deploy

# Runs only after the CI workflow has succeeded on main -- a red e2e or
# Phase M Docker job must never reach production (the deploy script itself
# only re-runs the unit tests and the frontend build). Deliberately no
# pull_request trigger: this repo is public and the runner is self-hosted on
# the deploy host, so a workflow from a fork PR would execute untrusted code
# next to production credentials. workflow_run fires in the base repo's
# context. The `branches` filter alone is not enough: it matches the head
# branch NAME, so a fork PR from a branch called `main` passes it. The job's
# `if` also requires the CI run to be a push to this repository, i.e. by an
# account with write access. workflow_dispatch stays for manual rollouts.
# On the host, scripts/runner-job-guard.sh refuses any job whose workflow is
# not this file on main (a fork PR can add its own self-hosted workflow).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Queue rather than cancel: a superseded run should still finish its release
# swap and restart instead of being killed mid-swap.
concurrency:
  group: deploy-fiesta
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: [self-hosted, fiesta-deploy]
    timeout-minutes: 30
    steps:
      # No actions/checkout on purpose: deploy-fiesta.sh keeps its own clone
      # and builds a fresh release directory from origin/<branch>. It runs
      # ruff + pytest + the frontend type-check/build before anything is
      # swapped, and rolls back if a node fails its health check.
      - name: Pull, test, build, swap
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: /srv/fiesta/bin/deploy-fiesta.sh "$BRANCH"
