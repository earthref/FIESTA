name: Labels
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      # For label-checker
      - labeled
      - unlabeled

jobs:
  labeler:
    # Only on content events: re-running on labeled/unlabeled would undo a
    # manual relabel (e.g. swapping docs+internal for feature).
    if: contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@v7
  # Run this after labeler applied labels (and on every label change)
  check-labels:
    needs:
      - labeler
    if: ${{ !cancelled() }}
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      # Pinned by digest (v1.6.115, the image :latest pointed at on
      # 2026-09-20): this job runs with a token on pull_request_target.
      - uses: docker://agilepathway/pull-request-label-checker@sha256:253c71fe97d6ae19fff21608f1e10493ec322e7c95d4fed4695b2b8d11f58fb2
        with:
          one_of: breaking,security,feature,bug,refactor,upgrade,docs,internal
          repo_token: ${{ secrets.GITHUB_TOKEN }}
