name: Labels
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      # For label-checker
      - labeled
      - unlabeled

jobs:
  labeler:
    # Only on content events: re-running on labeled/unlabeled would undo a
    # manual relabel (e.g. swapping docs+internal for feature).
    if: contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@v6
  # Run this after labeler applied labels (and on every label change)
  check-labels:
    needs:
      - labeler
    if: ${{ !cancelled() }}
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: docker://agilepathway/pull-request-label-checker:latest
        with:
          one_of: breaking,security,feature,bug,refactor,upgrade,docs,lang-all,internal
          repo_token: ${{ secrets.GITHUB_TOKEN }}
