# FIESTA local development stack.
#
# One API process (`api`, /v1/{node}/...) and one job worker serve every node
# in FIESTA_NODE; each enabled node gets its own frontend (compose profile
# named after the node). Postgres, OpenSearch, MinIO and Mailpit are shared.
# Contributions are scoped per node in Postgres (one schema each), each node
# has its own OpenSearch index, MinIO prefix and job queue.
#
#   FIESTA_NODE=magic,karar,cdr     # in .env: which nodes the stack serves
#   make up                         # runs the nodes in FIESTA_NODE
#   make up FIESTA_NODE=magic,karar # override on the command line
#   docker compose up -d            # honors COMPOSE_PROFILES from .env
#
# Default host ports (override in .env):
#   api        8000      (all nodes: http://localhost:8000/v1/magic/config)
#   frontend   magic 8080 · kdd 8081 · cdr 8082 · karar 8083 · erda 8084 · osu-mgr 8086
#
# Postgres owns application state; MinIO holds revision files.
# `make rebuild` regenerates only the OpenSearch projection.
#
# Several nodes on ONE hostname (dev.earthref.org/MagIC/, /CDR/, ...): set
# <NODE>_BASE_PATH=/MagIC/ etc. in .env. It is baked into that node's frontend
# image (asset URLs, router base, nginx locations). Default "/" keeps the
# one-hostname-per-node layout.

name: fiesta

x-backend-env: &backend-env
  FIESTA_ENVIRONMENT: development
  FIESTA_CONFIG_FILE: /config/fiesta.yaml
  FIESTA_NODE: ${FIESTA_NODE:-magic}
  FIESTA_S3_BUCKET: fiesta-local
  FIESTA_DATABASE_URL: postgresql+asyncpg://fiesta:${POSTGRES_PASSWORD:-fiesta}@postgres:5432/fiesta
  FIESTA_OPENSEARCH_URL: http://opensearch:9200
  FIESTA_S3_ENDPOINT: http://minio:9000
  FIESTA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-fiesta}
  FIESTA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-fiesta-secret}
  FIESTA_SECRET_KEY: ${FIESTA_SECRET_KEY:-dev-only-change-me}
  FIESTA_SMTP_HOST: mailpit
  FIESTA_SMTP_PORT: 1025
  FIESTA_CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080","http://localhost:8081","http://localhost:8082","http://localhost:8083","http://localhost:8084","http://localhost:8086"]'
  # Local-dev portal-bar cross-links to sibling nodes on this host. `make`
  # computes this from the running node list + frontend ports; empty otherwise.
  FIESTA_PORTAL_URLS: ${FIESTA_PORTAL_URLS:-}

x-frontend: &frontend
  build:
    context: ./frontend
  depends_on:
    api:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fiesta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiesta}
      POSTGRES_DB: fiesta
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiesta -d fiesta"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    # Docker Hub stopped serving minio/minio in Sept 2026; Quay hosts the same digest.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fiesta}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fiesta-secret}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- The FIESTA API + worker (every node in FIESTA_NODE) -------------------
  api:
    build: ./backend
    environment: *backend-env
    volumes:
      - ./config:/config:ro
    command: >-
      sh -c "fiesta init &&
             uvicorn fiesta.apps.api:create_app --factory --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health-check')"
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    environment: *backend-env
    volumes:
      - ./config:/config:ro
    command: fiesta worker
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # ---- One frontend per enabled node (profile = node slug) -------------------
  frontend-magic:
    <<: *frontend
    build:
      context: ./frontend
      args:
        BASE_PATH: ${MAGIC_BASE_PATH:-/}
    profiles: [magic]
    environment:
      FIESTA_NODE: magic
    ports:
      - "${MAGIC_FRONTEND_PORT:-8080}:80"

  frontend-kdd:
    <<: *frontend
    build:
      context: ./frontend
      args:
        BASE_PATH: ${KDD_BASE_PATH:-/}
    profiles: [kdd]
    environment:
      FIESTA_NODE: kdd
    ports:
      - "${KDD_FRONTEND_PORT:-8081}:80"

  frontend-cdr:
    <<: *frontend
    build:
      context: ./frontend
      args:
        BASE_PATH: ${CDR_BASE_PATH:-/}
    profiles: [cdr]
    environment:
      FIESTA_NODE: cdr
    ports:
      - "${CDR_FRONTEND_PORT:-8082}:80"

  frontend-karar:
    <<: *frontend
    build:
      context: ./frontend
      args:
        BASE_PATH: ${KARAR_BASE_PATH:-/}
    profiles: [karar]
    environment:
      FIESTA_NODE: karar
    ports:
      - "${KARAR_FRONTEND_PORT:-8083}:80"

  frontend-erda:
    <<: *frontend
    build:
      context: ./frontend
      args:
        BASE_PATH: ${ERDA_BASE_PATH:-/}
    profiles: [erda]
    environment:
      FIESTA_NODE: erda
    ports:
      - "${ERDA_FRONTEND_PORT:-8084}:80"

  frontend-osu-mgr:
    <<: *frontend
    build:
      context: ./frontend
      args:
        BASE_PATH: ${OSU_MGR_BASE_PATH:-/}
    profiles: [osu-mgr]
    environment:
      FIESTA_NODE: osu-mgr
    ports:
      - "${OSU_MGR_FRONTEND_PORT:-8086}:80"

volumes:
  postgres-data:
  opensearch-data:
  minio-data:
