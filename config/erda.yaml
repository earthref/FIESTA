# FIESTA deployment configuration — ERDA node
# EarthRef.org Digital Archive: a general-purpose archive for any digital
# object associated with the Earth sciences. Unlike the measurement-oriented
# nodes, an ERDA contribution publishes *objects* (a spreadsheet, a poster, a
# video, a program) described by rich discovery metadata; the object's bytes
# live in the bucket alongside the canonical contribution file.

fiesta: 1
deployment: node

node:
  key: ERDA
  slug: erda
  title: EarthRef.org Digital Archive (ERDA)
  subtitle: >-
    Archiving any type of digital data object associated with the Earth
    sciences — data tables, diagrams, reports, maps, presentations and videos.
  color: "#006600" # EarthRef.org green (see frontend/src/lib/portals.ts)
  links:
    website: https://earthref.org/ERDA
    github_issues: https://github.com/earthref/ERDA/issues
  contact_email: erda@earthref.org

search:
  index: erda
  levels:
    - { name: Contributions, table: contribution }
    - { name: Digital Objects, table: objects, count_field: summary.objects._n_results }
    - { name: Files, table: files, count_field: summary.files._n_results }
  extra_types: []
  # Aggregated on summary._all.<field>.raw — the legacy Advanced Search
  # dropdowns (data type, expert level, project) plus the geographic and
  # timescale terms its term_type selector scoped queries to.
  filters:
    - { type: facet, field: data_types }
    - { type: facet, field: expert_level }
    - { type: facet, field: education_topics }
    - { type: facet, field: project }
    - { type: facet, field: project_group }
    - { type: facet, field: continents_oceans }
    - { type: facet, field: countries }
    - { type: facet, field: timescale_period }

storage:
  bucket: erda

data_model:
  versions: ["1.0"]
  latest: "1.0"
  dir: erda/data_models

vocabularies:
  controlled: erda/controlled_vocabularies.json
  suggested: erda/suggested_vocabularies.json

hierarchy:
  - contribution
  - objects
  - files

doi:
  prefix: 10.7288/V4/ERDA

# Content pages (/<slug>, HTML in <node>/pages/<slug>.html); none yet.
pages: []

# Plugin options (one map per plugin, validated against its Options model;
# edited in the admin UI's Plugins tab).
plugins:
  record-cards:
    # Result card per search table: title column, optional subtitle column, cells
    # (`width` is the legacy fixed-width cell in px; `format: bytes` renders sizes).
    cards:
      objects:
        title_column: title
        subtitle_column: description
        cells:
          - { column: data_types, label: Data Types, width: 150 }
          - { column: expert_level, label: Expert Level, width: 170 }
          - { column: keywords, label: Keywords, width: 200 }
          - { column: computer_program, label: Computer Program, width: 150 }
          - { column: project, label: Project, width: 180 }
          - { column: locations, label: Locations, width: 180 }
      files:
        title_column: file
        subtitle_column: description
        cells:
          - { column: format, label: Format, width: 90 }
          - { column: media_type, label: Media Type, width: 180 }
          - { column: size_bytes, label: File Size, width: 110, format: bytes }

features:
  plugins: [record-cards]

# Local fixtures only; never read during normal application startup.
development:
  seed_manifest: erda/seeds/manifest.yaml
