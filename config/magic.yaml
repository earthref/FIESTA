# FIESTA deployment configuration — MagIC node
# A FIESTA deployment is fully described by one of these files:
# identity/branding, search index, storage bucket, data model, vocabularies,
# summarization hierarchy, and enabled features. Postgres owns application
# state; the bucket stores revision files; OpenSearch is rebuilt from both.

fiesta: 1
deployment: node

node:
  key: MagIC
  slug: magic
  title: Magnetics Information Consortium (MagIC)
  subtitle: >-
    Promoting information technology infrastructures for the international
    paleomagnetic, geomagnetic and rock magnetic community.
  color: "#800080" # primary brand color (Semantic UI "purple" in the legacy app)
  links:
    website: https://earthref.org/MagIC
    github_issues: https://github.com/earthref/MagIC/issues
  contact_email: magic@earthref.org

search:
  index: magic
  # Ordered search tabs; `table` is the doc `type` in the index and the
  # data-model table the rows come from.
  levels:
    - { name: Contributions, table: contribution }
    - { name: Locations, table: locations, count_field: summary.locations._n_results }
    - { name: Sites, table: sites, count_field: summary.sites._n_results }
    - { name: Samples, table: samples, count_field: summary.samples._n_results }
    - { name: Specimens, table: specimens, count_field: summary.specimens._n_results }
    - { name: Measurements, table: measurements, count_field: summary.measurements._n_results }
  # (The Poles search level is contributed by the `poles` plugin below.)
  extra_types: []
  # Filter sidebar controls (facet / range / bbox), edited in the admin UI's
  # Search Filters tab. Facets aggregate on summary._all.<field>.raw and show on
  # every level's Summaries and Rows views; the poles range/bbox filters show
  # on the Locations level's Poles view (the `poles` plugin indexes
  # summary.poles.age in years, hence the Ma scale).
  filters:
    - { type: facet, field: method_codes, views: [Summaries, Rows] }
    - { type: facet, field: geologic_classes, views: [Summaries, Rows] }
    - { type: facet, field: geologic_types, views: [Summaries, Rows] }
    - { type: facet, field: lithologies, views: [Summaries, Rows] }
    - { type: facet, field: location_type, views: [Summaries, Rows] }
    - { type: facet, field: plate_blocks, views: [Summaries, Rows] }
    - { type: facet, field: tectonic_settings, views: [Summaries, Rows] }
    - { type: range, label: Age, field: summary.poles.age, unit: Ma, scale: 1.0e6, levels: [Locations], views: [Poles] }
    - { type: range, label: Pole A95, field: summary.poles.pole_alpha95, unit: "°", levels: [Locations], views: [Poles] }
    - { type: bbox, label: Geospatial, levels: [Locations], views: [Poles] }

storage:
  bucket: magic
  # Bucket layout (convention, not configurable):
  #   contributions/{id}/{filename}         canonical contribution text file per version id
  #   uploads/{user_id}/{upload_id}/...     raw uploaded files pre-parse

data_model:
  versions: ["2.2", "2.3", "2.4", "2.5", "3.0"]
  latest: "3.0"
  dir: magic/data_models # relative to this file; {version}.json per version

vocabularies:
  controlled: magic/controlled_vocabularies.json
  suggested: magic/suggested_vocabularies.json
  method_codes: magic/method_codes.json

# Parent -> child chain used to summarize contribution rows into per-level
# search documents (summary._all aggregates roll up through this chain).
hierarchy:
  - contribution
  - locations
  - sites
  - samples
  - specimens
  - measurements

doi:
  prefix: 10.7288/V4/MAGIC

# Content pages, in menu order: /<slug> renders magic/pages/<slug>.html (edited
# in the admin UI's Pages tab). `menu` is left, right (with an icon) or hidden.
pages:
  - { slug: about, title: About }
  - { slug: technology, title: Technology }
  - { slug: grand-challenges, title: Grand Challenges }
  - { slug: workshops, title: Workshops }
  - { slug: links, title: Links }
  - { slug: help, title: Help, menu: right, icon: question-circle }
  - { slug: jupyter-notebooks, title: Jupyter Notebooks, menu: hidden }

features:
  plugins: [poles]
  # Home page content (legacy client/modules/magic/components/home.jsx + home_news.jsx).
  home:
    # `ui nine cards` resource row: Semantic icon names; `to` = SPA route, `href` = external.
    resources:
      - { title: "Data\nModel", icon: sitemap, corner_icon: table, to: /data-models/3.0 }
      - { title: "Method\nCodes", icon: lab, corner_icon: write, to: /method-codes }
      - { title: "Vocabulary\nLists", icon: list, corner_icon: info, to: /vocabularies }
      - { title: "PmagPy\nSoftware", icon: bar chart, corner_icon: calculator, href: "https://pmagpy.github.io/PmagPy-docs/intro.html" }
      - { title: "Paleomag\nTextbook", icon: book, corner_icon: info, href: "https://earthref.org/MagIC/books/Tauxe/Essentials/" }
      - { title: "Jupyter\nNotebooks", icon: file outline, corner_icon: code, to: /jupyter-notebooks }
      - { title: "YouTube\nChannel", icon: tv, corner_icon: headphones, href: "https://www.youtube.com/channel/UC-DbvhEu49a6dZXdvUWorhQ" }
      - { title: "MagIC/FIESTA\nAPI", icon: exchange, corner_icon: info, href: "https://api.earthref.org/" }
      - { title: "MagIC FAQ\nand Help", icon: question, to: /help }
    # Right-hand news column, newest first. `image` is a file in config/magic/assets/ or a URL.
    news:
      - title: Paleomagnetism.org file converter
        image: pmag_org_logo.png
        html: >-
          To facilitate direction paleomagnetic data sharing between laboratories,
          Paleomagnetism.org has developed a
          <a href="https://beta.paleomagnetism.org/converter"><b>File Format Converter</b></a>.
          Visit the beta site and try it out. Please send comments, problem reports, or
          requests for additional formats to paleomagnetism.org@gmail.com
      - title: MagIC at AGU
        image: agu.jpg
        html: >-
          MagIC will be presenting a poster that this year's AGU conference. It will be in the
          Monday afternoon poster session <b>(GP13B-0307)</b>. Please drop by and see what is new
          with MagIC in 2025 and talk with us about what you would like to see MagIC do for you in
          the future. A copy of this year's poster can be found at
          <a href="https://njarboe.com/public/JarboeMagIC2025AGUPoster.pdf"><b>here</b></a>.
          See you there!
      - title: Mag-NetZ
        image: https://github.com/earthref/MagIC-MagNetS/raw/master/MagnetZ_Logo.jpg
        html: >-
          <a href="https://earthref.org/MagIC/MagNetZ"><b>MagNetZ (Magnetic NetworkZ)</b></a>
          is a biweekly online seminar organized by <b>Greig Paterson</b> and
          <b>Anita Di Chiara</b>. The seminars cover topics in the geomagnetism, paleomagnetism,
          rock magnetism, archeomagnetism, and environmental magnetism (all things magnetic).
          Visit the <a href="https://earthref.org/MagIC/MagNetZ"><b>website</b></a> for info on
          all the <b>speakers</b>, their <b>abstracts</b>, as well as links to the <b>YouTube</b>
          videos, <b>ERDA</b> entries, <b>citable DOIs</b>.
      - title: 2021 MagIC Workshop
        image: sio.jpg
        html: >-
          MagIC hosted its 2021 workshop on <b>January 19th-21st, 2021</b> online via Zoom and
          Slack with 194 participants. Titled
          "<a href="https://earthref.org/events/MAGIC/2021/"><b>2021 MagIC Workshop: Rock and
          Paleomagnetism through Time and Space</b></a>", it consisted of three days of science
          talks in four sessions. Visit the
          <a href="https://earthref.org/events/MAGIC/2021/"><b>workshop website</b></a> for the
          full schedule and other workshop details. The
          <a href="https://www.youtube.com/playlist?list=PLirL2unikKCi2xvyly82krC-_jWpelB0P"><b>workshop talks</b></a>
          and
          <a href="https://www.youtube.com/playlist?list=PLirL2unikKChSOapeWSKBZRbj1aGiT48r"><b>poster lightning talks</b></a>
          are up on our YouTube channel. The posters can be found on MagIC's Slack channel.
          Email Nick Jarboe (njarboe@ucsd.edu) to request an invite to the channel.
      - title: 2020 MagIC Workshop Tutorial Videos
        image: youtube.png
        link: https://www.youtube.com/playlist?list=PLirL2unikKCgUkHQ3m8nT29tMCJNBj4kj
        html: >-
          In lieu of the postponed 2020 MagIC Workshop, Magic hosted a series of
          <a href="https://www.youtube.com/playlist?list=PLirL2unikKCgUkHQ3m8nT29tMCJNBj4kj"><b>tutorials</b></a>
          over three days covering some of the material which was to be presented in the hands-on
          part of the workshop. The <a href="https://youtu.be/pchdPBzSmT0"><b>first</b></a> was on
          the MagIC data model and the uploading of data to the MagIC database, the
          <a href="https://youtu.be/GUjf33aNnFQ"><b>second</b></a> was on the PmagPy Demag GUI
          data import, analysis, and MagIC file export software, the
          <a href="https://www.youtube.com/watch?v=9yGPbATqRtI"><b>third</b></a> was on using
          PmagPy and Jupyter notebooks. These tutorial videos and others can be found on the
          <a href="https://www.youtube.com/playlist?list=PLirL2unikKCgUkHQ3m8nT29tMCJNBj4kj"><b>2020 MagIC Workshop Tutorial playlist</b></a>
          on the
          <a href="https://www.youtube.com/channel/UC-DbvhEu49a6dZXdvUWorhQ"><b>MagIC YouTube Channel</b></a>.
      - title: Project 419 / GeoCODES
        image: ec.jpg
        html: >-
          MagIC is working with EarthCube
          <a href="https://www.earthcube.org/geocodes" target="_blank" rel="noreferrer"><b>GeoCODES</b></a>
          to publish <a href="https://json-ld.org/" target="_blank" rel="noreferrer"><b>JSON-LD</b></a>
          contribution metadata. MagIC is providing a rich selection of HTML5 microdata
          <a href="https://schema.org/" target="_blank" rel="noreferrer"><b>schema.org</b></a>
          parameters for its versioned datasets and associated references. These embedded metadata
          are also suitable for crawling by the
          <a href="https://www.epos-ip.org/" target="_blank" rel="noreferrer"><b>European Plate Observing System</b></a>
          and
          <a href="https://developers.google.com/search/docs/guides/intro-structured-data" target="_blank" rel="noreferrer"><b>Google Search with Structured Data</b></a>.

# Legacy Meteor sources, read only by `fiesta legacy-inventory` (Phase M5/M6).
# `magic-activated-contributions` is the append-only archive, `magic-contributions`
# the latest-only mirror; `magic-private-contributions` is fed by an external
# pipeline. Only the canonical `.txt` is imported; the `.zip` companions
# (measurement bundles, up to 17 GB) need streaming copy and are a follow-up.
legacy:
  source_id: legacy-magic
  index: magic
  buckets: [magic-activated-contributions, magic-contributions, magic-private-contributions]
  users_index: er_users

# Local fixtures only; never read during normal application startup.
development:
  seed_manifest: magic/seeds/manifest.yaml
