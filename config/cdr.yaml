# FIESTA deployment configuration — CDR node

fiesta: 1
deployment: node

node:
  key: CDR
  slug: cdr
  title: Core Data Repository (CDR)
  subtitle: >-
    Archiving geological drilling samples multi-sensor track data for sediment
    and rock cores.
  color: "#e09f00" # Semantic UI "yellow" in the legacy app
  links:
    website: https://earthref.org/CDR
    github_issues: https://github.com/earthref/CDR/issues
  contact_email: cdr@earthref.org

search:
  index: cdr
  levels:
    - { name: Contributions, table: contribution }
    - { name: Cores, table: cores, count_field: summary.cores._n_results }
    - { name: Sections, table: sections, count_field: summary.sections._n_results }
    - { name: Measurements, table: measurements, count_field: summary.measurements._n_results }
  extra_types: []
  # The legacy CDR sidebar's bucket filters (search.jsx), on CDR columns.
  filters:
    - { type: facet, field: cruise, label: Cruise/Expedition }
    - { type: facet, field: method, label: Coring Method }
    - { type: facet, field: material, label: Core Material }
    - { type: facet, field: research_vessel, label: Research Vessel }
    - { type: facet, field: pis, label: Principal Investigator }
    - { type: facet, field: lab_names, label: Lab }
    - { type: facet, field: method_codes, label: Method Codes }
    - { type: facet, field: instrument_codes, label: Instrument Codes }

storage:
  bucket: cdr

data_model:
  versions: ["1.0"]
  latest: "1.0"
  dir: cdr/data_models

vocabularies:
  controlled: cdr/controlled_vocabularies.json
  suggested: cdr/suggested_vocabularies.json

hierarchy:
  - contribution
  - cores
  - sections
  - measurements

doi:
  prefix: 10.7288/V4/CDR

# Content pages (/<slug>, HTML in <node>/pages/<slug>.html); none yet.
pages: []

# Plugin options (one map per plugin, validated against its Options model;
# edited in the admin UI's Plugins tab).
plugins:
  depth-plot:
    levels: [Cores]
    depth_columns: [mbs_corrected, depth]
    # Measurement tracks, matching the legacy seriesDefs (key, label, color).
    series:
      - { key: gamma_density, label: Gamma Density, color: "#1f77b4" }
      - { key: mag_susc_chi_mass, label: Mag Susc χmass, color: "#ff7f0e" }
      - { key: res, label: Resistivity (ohm-m), color: "#2ca02c" }
      - { key: pwave_v, label: P-wave Velocity (m/s), color: "#d62728" }
      - { key: fp, label: Porosity (frac), color: "#9467bd" }
      - { key: k, label: K (cps), color: "#8c564b" }
      - { key: ca, label: Ca (cps), color: "#e377c2" }
      - { key: ti, label: Ti (cps), color: "#7f7f7f" }
      - { key: fe, label: Fe (cps), color: "#bcbd22" }
      - { key: zr, label: Zr (cps), color: "#17becf" }

features:
  plugins: [depth-plot]

# Legacy Meteor sources, read only by `fiesta legacy-inventory` (Phase M5/M6).
# CDR never had S3 buckets; every contribution is exported from the indexed tables.
# `cdr` is the alias the legacy private-workspace page writes to (data model 1.0);
# the separate `cdr-3` index (data model 3.0) is not importable until that model
# exists under config/cdr/data_models/.
legacy:
  source_id: legacy-cdr
  index: cdr
  buckets: []
  users_index: er_users

# Local fixtures only; never read during normal application startup.
development:
  seed_manifest: cdr/seeds/manifest.yaml
