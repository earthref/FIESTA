# FIESTA deployment configuration — OSU-MGR node
# Oregon State University Marine and Geology Repository: the curation catalogue
# for the repository's holdings — cruises, cores and their sections, dredge and
# ROV rocks, sample requests, IGSN registrations, and the data files, images and
# reports attached to each of them.
#
# Scope note: this node catalogues *holdings*, not measurements. The MST and XRF
# measurement series that come off this material are published through the CDR
# node (see osu-mgr-pipeline/CDR_PREVIEW.md); here they appear as `files` rows of
# type mst-data / xrf-data.

fiesta: 1
deployment: node

node:
  key: OSU-MGR
  slug: osu-mgr
  title: OSU Marine and Geology Repository (OSU-MGR)
  subtitle: >-
    Curating marine and terrestrial sediment cores, dredged and ROV-collected
    rocks, and the data collected from them at Oregon State University.
  color: "#D73F09" # OSU Beaver Orange (osu-mgr.org tailwind.config.js)
  links:
    website: https://osu-mgr.org
    github_issues: https://github.com/earthref/OSU-MGR/issues
  contact_email: osu-mgr@oregonstate.edu

search:
  # NOT `osu-mgr`: the repository's own pipeline owns an OpenSearch alias by
  # that name (osu_mgr_pipeline.py). Keeping the names distinct means a FIESTA
  # deployment can share a cluster with the pipeline without either clobbering
  # the other.
  index: osumgr
  levels:
    - { name: Contributions, table: contribution }
    - { name: Cruises, table: cruises, count_field: summary.cruises._n_results }
    - { name: Cores, table: cores, count_field: summary.cores._n_results }
    - { name: Sections, table: sections, count_field: summary.sections._n_results }
    - { name: Dives, table: dives, count_field: summary.dives._n_results }
    - { name: Rocks, table: dive_samples, count_field: summary.dive_samples._n_results }
    - { name: Files, table: files, count_field: summary.files._n_results }
  # Searchable without a tab of their own — the leaf levels the repository's own
  # search does not surface as a type but which /api/search/{table} can target.
  extra_types: [section_halves, core_samples, dive_subsamples]
  # The repository search's filter groups: file types, collection methods,
  # materials, research vessels, institutions, plus the collection itself.
  filters:
    - { type: facet, field: file_type }
    - { type: facet, field: method }
    - { type: facet, field: material }
    - { type: facet, field: texture }
    - { type: facet, field: rv_name }
    - { type: facet, field: pi_institution }
    - { type: facet, field: collection }

storage:
  bucket: osu-mgr

data_model:
  versions: ["1.0"]
  latest: "1.0"
  dir: osu-mgr/data_models

vocabularies:
  controlled: osu-mgr/controlled_vocabularies.json
  suggested: osu-mgr/suggested_vocabularies.json

# Two branches (core and dive) flattened into the summarization order; parentage
# is carried by each table's `in("<parent>.<key>")` column, not by this list.
hierarchy:
  - contribution
  - cruises
  - cores
  - sections
  - section_halves
  - core_samples
  - dives
  - dive_samples
  - dive_subsamples
  - files

doi:
  prefix: 10.7288/V4/OSU-MGR

# Content pages (/<slug>, HTML in <node>/pages/<slug>.html); none yet.
pages: []

# Plugin options (one map per plugin, validated against its Options model;
# edited in the admin UI's Plugins tab).
plugins:
  record-cards:
    # Result card per search table: title column, optional subtitle column, cells
    # (`width` is the legacy fixed-width cell in px; `format: bytes` renders sizes).
    cards:
      cruises:
        title_column: cruise
        subtitle_column: place
        cells:
          - { column: cruise_name, label: Cruise Name, width: 220 }
          - { column: rv_name, label: Research Vessel, width: 160 }
          - { column: pi, label: PI, width: 150 }
          - { column: pi_institution, label: Institution, width: 180 }
          - { column: collection, label: Collection, width: 150 }
          - { column: accession_date, label: Accessioned, width: 110 }
      cores:
        title_column: core
        subtitle_column: notes
        cells:
          - { column: method, label: Method, width: 150 }
          - { column: material, label: Material, width: 110 }
          - { column: length, label: Length (cm), width: 110 }
          - { column: lat, label: Latitude, width: 100 }
          - { column: lon, label: Longitude, width: 100 }
          - { column: water_depth, label: Water Depth, width: 110 }
          - { column: start_date, label: Collected, width: 110 }
          - { column: area, label: Area, width: 160 }
      sections:
        title_column: section
        cells:
          - { column: section_number, label: Section, width: 90 }
          - { column: depth_top, label: Depth Top (cm), width: 120 }
          - { column: depth_bottom, label: Depth Bottom (cm), width: 140 }
          - { column: length, label: Length (cm), width: 110 }
          - { column: igsn, label: IGSN, width: 180 }
          - { column: storage_location, label: Storage, width: 180 }
      dives:
        title_column: dive
        subtitle_column: notes
        cells:
          - { column: method, label: Method, width: 130 }
          - { column: rov_name, label: ROV, width: 150 }
          - { column: weight, label: Recovery (kg), width: 120 }
          - { column: lat, label: Latitude, width: 100 }
          - { column: lon, label: Longitude, width: 100 }
          - { column: water_depth, label: Water Depth, width: 110 }
          - { column: start_date, label: Collected, width: 110 }
          - { column: area, label: Area, width: 160 }
      dive_samples:
        title_column: dive_sample
        subtitle_column: notes
        cells:
          - { column: texture, label: Principal Texture, width: 200 }
          - { column: material, label: Material, width: 110 }
          - { column: weight, label: Weight (kg), width: 110 }
          - { column: igsn, label: IGSN, width: 180 }
          - { column: sesar_resource_type, label: SESAR Type, width: 150 }
          - { column: storage_location, label: Storage, width: 180 }
      files:
        title_column: file
        subtitle_column: description
        cells:
          - { column: file_type, label: File Type, width: 170 }
          - { column: osu_id, label: OSU-ID, width: 200 }
          - { column: media_type, label: Media Type, width: 160 }
          - { column: size_bytes, label: File Size, width: 110, format: bytes }
          - { column: moratorium, label: Moratorium, width: 110 }

features:
  plugins: [record-cards]

# Local fixtures only; never read during normal application startup.
development:
  seed_manifest: osu-mgr/seeds/manifest.yaml
