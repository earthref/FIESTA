# FIESTA deployment configuration — the API (api.earthref.org)
# One FastAPI process serves every node listed here under /v2/{node}/...
# (search, contributions, the private workspace, config, plugins) using each
# node's own Postgres schema, OpenSearch index, storage prefix and job queue.
# FIESTA_NODE=magic,karar narrows a local stack to some of them.

fiesta: 1
deployment: api

api:
  title: EarthRef FIESTA API
  # Where contributions come from (docs/data-sources.md). Until the cutover from
  # Meteor a deployment mirrors each node's data source (`sources/<slug>.py`)
  # and takes no uploads; `source,karar=public` once KArAr cuts over.
  # FIESTA_CONTRIBUTIONS_MODE overrides it: local stacks and tests run `public`.
  contributions_mode: source
  nodes:
    - magic.yaml
    - kdd.yaml
    - cdr.yaml
    - karar.yaml
    - erda.yaml
    - osu-mgr.yaml
    - sc.yaml
