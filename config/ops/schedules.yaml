# Scheduled operations, run by `fiesta ops-worker` (MARFIK3) on the `ops`
# procrastinate queue. Format and rules: backend/fiesta/ops/config.py and
# docs/ops-scheduler.md. Times are UTC. Not a node: this directory is not a
# node tree, and no node may be called `ops`.

fiesta-ops: 1

slack:
  # Channel ID (right-click the channel > View channel details) of the MARFIK
  # monitor channel in the EarthRef Slack workspace; the bot must be invited to
  # it. Empty: status messages are logged by the ops worker instead of posted.
  # The bot token is FIESTA_SLACK_BOT_TOKEN in the ops worker's environment.
  channel: ""

watchdog:
  cron: "*/15 * * * *"   # missed-run check, in the ops worker
  realert: 24h           # repeat an alert this often while a schedule stays overdue

schedules:
  # OSU-MGR OpenSearch incremental update (github.com/osu-mgr/osu-mgr-pipeline).
  # Listing the ~1.4M S3 objects alone takes ~7 min; the lock keeps it from
  # ever running concurrently with itself. The pipeline reads its own .env.
  - name: osu-mgr-incremental
    node: osu-mgr
    description: OSU-MGR OpenSearch incremental update (S3 changes in the last 72h)
    cron: "0 10 * * *"
    command: [.venv/bin/python, osu_mgr_pipeline.py, --incremental, --since, 72h]
    cwd: /srv/osu-mgr-pipeline   # operator to confirm the checkout path on MARFIK3
    timeout: 2h
    notify: both
    expected_interval: 26h

  # KdD data source: Meteor KdD -> FIESTA KdD through the API's /v2/kdd/source
  # (docs/data-sources.md). Does nothing while the API serves KdD in public
  # mode. The env file holds the Meteor read credentials (FIESTA_OPENSEARCH_URL,
  # FIESTA_S3_*), the API (FIESTA_SOURCE_API) and the KdD node admin it signs in
  # as (FIESTA_SOURCE_EMAIL / _PASSWORD); never FIESTA_DATABASE_URL. Disabled
  # until the operator has run it once by hand (OPERATOR_TODO).
  - name: kdd-source
    node: kdd
    description: Sync KdD contributions from Meteor KdD (data-source mode)
    enabled: false
    cron: "20 * * * *"
    command: [.venv/bin/python, ../sources/kdd.py, --state-dir, /var/lib/fiesta-ops/sources/kdd]
    cwd: /srv/fiesta-ops/FIESTA/backend
    env_file: /etc/fiesta/source-kdd.env
    env:
      FIESTA_CONFIG_FILE: ../config/fiesta.yaml
      FIESTA_NODE_CONFIG_SOURCE: files
    timeout: 30m
    notify: failure
    expected_interval: 3h
    summary_keys: [applied, unchanged, quarantined, errors]
