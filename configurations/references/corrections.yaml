# Corrections to publication metadata that the registries (Crossref, DataCite)
# hold wrongly, for every node: fiesta.services.references applies them when it
# builds a DOI's `_reference`, and `fiesta init` (every deploy) re-applies them
# to the cached references and their contributions' search docs. Not a node:
# this directory is not a node tree, and no node may be called `references`.
#
# Keys are DOIs (any case, bare or as a doi.org URL). Fields: title, journal,
# year, volume, issue, page; `note` says why (not shown). Check a correction
# against the publisher's page or another index first. Ask the publisher to fix
# their Crossref deposit too, then drop the entry once Crossref has it right.

10.1007/BF00240570:
  title: "Stratigraphy and paleomagnetism of a 3-km-thick Miocene lava pile in the Mjoifjördur area, eastern Iceland"
  note: Crossref has U+FFFD for ö (Semantic Scholar has it right, 2026-11-13)

