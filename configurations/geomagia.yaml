# FIESTA deployment configuration — GEOMAGIA node
# (GEOMAGIA50 archeomagnetic and volcanic data. Data model converted from the
# GEOMAGIA MySQL schema (ARCHEODIJ + REFS) and the public ID glossary,
# 2026-11-13; see configurations/geomagia/README.md.)

fiesta: 1
deployment: node

node:
  key: GEOMAGIA
  slug: geomagia
  title: GEOMAGIA50 Archeomagnetic and Volcanic Database (GEOMAGIA)
  subtitle: >-
    Archeomagnetic and volcanic paleomagnetic directions and intensities of
    the past 50,000 years, compiled from the published literature.
  color: "#00579b" # the GEOMAGIA50 site's blue
  logo: logo.svg # configurations/geomagia/assets/, on the FIESTA portal home
  links:
    website: https://geomagia.gfz.de

search:
  index: geomagia
  # A site's geography, listed by the summary grid's Geography tile.
  geography:
    geographic: [continent, region_country, site_name]
  placeholder: 'e.g. pottery Thellier "baked clay"'
  levels:
    - name: Contributions
      table: contribution
      columns:
        - { cell: title, column: citation, subtitle_column: title }
        - { column: journal, label: Journal, width: 180 }
        - { column: year, label: Year, width: 80, facets: [] }
        - { cell: counts }
        - { cell: map }
        - { cell: contributed }
    - name: Sites
      table: sites
      count_field: summary.sites._n_results
      columns:
        - { cell: title, column: site, subtitle_column: site_name }
        - { column: archeo_volcanic, label: Type, width: 90 }
        - { column: region_country, label: Region/Country, width: 140 }
        - { column: materials, label: Materials, width: 150 }
        - { column: age, label: Age (CE), width: 90 }
        - { column: ba, label: Intensity (μT), width: 110 }
        - { column: vadm, label: VADM (10²² Am²), width: 130 }
        - { column: decl, label: Dec, width: 70 }
        - { column: incl, label: Inc, width: 70 }
        - { column: alpha_95, label: α95, width: 70 }
        - { cell: citation }
  extra_types: []
  filters:
    # Every node's contribution filters (the contribution block's id, reference DOI, contributor, timestamp).
    - { type: facet, field: id, label: Contribution ID }
    - { type: facet, field: doi, label: Contribution DOI }
    - { type: facet, field: contributor, label: Contributor }
    - { type: range, field: summary.contribution.timestamp, label: Contributed On, date: true }
    # The GEOMAGIA site's query form and refinements (search/forms.py,
    # refinements.py). data_type, pi_family, md_check, cooling_rate_check,
    # age_error and direction_n are derived by the geomag-series plugin (its
    # README); its site-name and radius searches follow these filters.
    - { type: facet, field: data_type, label: Data Type, views: [Summaries, Rows, Map, Plots] }
    - { type: facet, field: archeo_volcanic, views: [Summaries, Rows, Map, Plots] }
    - { type: range, label: Age, field: summary._num.age, unit: yr CE, levels: [Contributions, Sites], views: [Summaries, Rows, Map, Plots] }
    - { type: range, label: Paleointensity, field: summary._num.ba, unit: μT, levels: [Contributions, Sites], views: [Summaries, Rows, Map, Plots] }
    - { type: range, label: VADM, field: summary._num.vadm, unit: 10²² Am², levels: [Contributions, Sites], views: [Summaries, Rows, Map, Plots] }
    - { type: range, label: Declination, field: summary._num.decl, unit: "°", levels: [Contributions, Sites], views: [Summaries, Rows, Map, Plots] }
    - { type: range, label: Inclination, field: summary._num.incl, unit: "°", levels: [Contributions, Sites], views: [Summaries, Rows, Map, Plots] }
    - { type: facet, field: region_country, views: [Summaries, Rows, Map, Plots] }
    - { type: facet, field: continent, views: [Summaries, Rows, Map, Plots] }
    - { type: facet, field: materials, views: [Summaries, Rows, Map, Plots] }
    - { type: facet, field: dating_methods, views: [Summaries, Rows, Map, Plots] }
    - { type: facet, field: pi_family, label: Paleointensity Method Family, views: [Summaries, Rows, Map, Plots] }
    - { type: facet, field: pi_methods, views: [Summaries, Rows, Map, Plots] }
    - { type: facet, field: alteration_checks, views: [Summaries, Rows, Map, Plots] }
    - { type: facet, field: md_check, label: Multi-Domain Checks, views: [Summaries, Rows, Map, Plots] }
    - { type: facet, field: cooling_rate_check, label: Cooling Rate Correction, views: [Summaries, Rows, Map, Plots] }
    - { type: facet, field: anisotropy_use_status, views: [Summaries, Rows, Map, Plots] }
    - { type: range, label: Paleointensity Specimens Accepted, field: summary._num.num_acc_spec, levels: [Contributions, Sites], views: [Summaries, Rows, Map, Plots] }
    - { type: range, label: Paleointensity Error σBa, field: summary._num.sigma_ba, unit: μT, levels: [Contributions, Sites], views: [Summaries, Rows, Map, Plots] }
    - { type: range, label: Directional Specimens or Samples, field: summary._num.direction_n, levels: [Contributions, Sites], views: [Summaries, Rows, Map, Plots] }
    - { type: range, label: Direction α95, field: summary._num.alpha_95, unit: "°", levels: [Contributions, Sites], views: [Summaries, Rows, Map, Plots] }
    - { type: range, label: Age Error, field: summary._num.age_error, unit: yr, levels: [Contributions, Sites], views: [Summaries, Rows, Map, Plots] }
    - { type: numeric, label: Numeric, views: [Summaries, Rows, Map, Plots] }
    - { type: text, label: Text, views: [Summaries, Rows, Map, Plots] }
    - { type: exists, label: With / Without Data, views: [Summaries, Rows, Map, Plots] }
  map_colors:
    - { label: Age, field: age, unit: yr CE }
    - { label: Paleointensity, field: ba, unit: μT }
    - { label: VADM, field: vadm, unit: 10²² Am² }
    - { label: Inclination, field: incl, unit: "°" }

storage:
  bucket: geomagia

data_model:
  versions: ["1.0"]
  latest: "1.0"
  dir: geomagia/data_models

vocabularies:
  controlled: geomagia/controlled_vocabularies.json

hierarchy:
  - contribution
  - sites

# Content pages (/<slug>, HTML in <node>/pages/<slug>.html); none yet.
pages: []

features:
  plugins: [geomag-series]

plugins:
  # The Sites level's Plots sub-tab (the GEOMAGIA site's search plots) and its
  # query refinements. The method families and codes are GEOMAGIA's
  # (search/refinements.py PI_FAMILIES; 27 is in two).
  geomag-series:
    base_level: Sites
    age: age
    age_minus: age_min
    age_plus: age_max
    age_error_type: age_error_type
    age_sigmas: num_sigmas
    intensity: ba
    intensity_error: sigma_ba
    declination: decl
    inclination: incl
    alpha95: alpha_95
    latitude: lat
    color_id: site_id
    color_label: region_country
    hover: [site_horizon, site_name, summary.contribution.citation, uid]
    export_name: geomagia
    name_search: site_name
    radius_search: true
    pi_methods: pi_method_id
    pi_families:
      - { name: Thellier Family, codes: ["1", "2", "3", "4", "5", "11", "12", "25"] }
      - { name: Shaw Family, codes: ["6", "20", "21", "22", "23", "24", "29"] }
      - { name: Microwave, codes: ["7", "8", "15", "16", "17", "19", "27"] }
      - { name: Triaxe, codes: ["9"] }
      - { name: Dekkers and Bohnel Family, codes: ["10", "13"] }
      - { name: Walton, codes: ["26", "27"] }
      - { name: Wilson, codes: ["28"] }
      - { name: Pseudo-Thellier, codes: ["14"] }
    checks:
      md_check: md_ck_id
      cooling_rate_check: cr_corr_set_id
    direction_counts: [num_dir_specimens, num_dir_samples]

# The API serves it (so its data source can sync it); production's SPA and
# portal bar do not list it until the GEOMAGIA team signs off. Local stacks
# serve it either way.
publish:
  api: true
  web: false

# The data source, read only by configurations/sources/geomagia.py: the GEOMAGIA50
# MySQL catalogue (GEOMAGIA_MYSQL_* in the run's env file), else the public exports.
legacy:
  kind: script
  source_id: geomagia50

# Local fixtures only; never read during normal application startup.
development:
  seed_manifest: geomagia/seeds/manifest.yaml
