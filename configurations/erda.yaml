# FIESTA deployment configuration — ERDA node
# EarthRef.org Digital Archive: a general-purpose archive for any digital
# object associated with the Earth sciences. Unlike the measurement-oriented
# nodes, an ERDA contribution publishes *objects* (a spreadsheet, a poster, a
# video, a program) described by rich discovery metadata; the object's bytes
# live in the bucket alongside the canonical contribution file.

fiesta: 1
deployment: node

node:
  key: ERDA
  slug: erda
  title: EarthRef.org Digital Archive (ERDA)
  subtitle: >-
    Archiving any type of digital data object associated with the Earth
    sciences — data tables, diagrams, reports, maps, presentations and videos.
  color: "#006600" # EarthRef.org green (see fiesta/frontend/src/lib/portals.ts)
  logo: logo.svg # configurations/erda/assets/, on the FIESTA portal home
  links:
    website: https://earthref.org/ERDA
    github_issues: https://github.com/earthref/ERDA/issues

search:
  index: erda
  # Each level's `columns` are its Summaries grid (header, sort, filter), edited
  # in the admin UI's Summary Grid tab; a level without them shows the default
  # tiles. `{ column, label, width }` is a data column; `cell` names a tile.
  levels:
    - name: Contributions
      table: contribution
      # No geography, geology, ages, intensities, method codes or plots: the
      # contribution's object types and keywords and its files' formats
      # instead (2026-11-13).
      columns:
        - { cell: record }
        - { cell: download }
        - { cell: links }
        - { cell: counts }
        - { cell: map }
        - cell: fields
          label: Digital Objects
          show: values
          width: 200
          columns:
            - { column: data_types, label: Types }
            - { column: keywords, label: Keywords }
        - { cell: field, column: format, label: File Formats, show: values, width: 140 }
        - { cell: citations }
    - name: Digital Objects
      table: objects
      count_field: summary.objects._n_results
      columns:
        - { cell: title, column: title, subtitle_column: description }
        - { column: data_types, label: Data Types, width: 150 }
        - { column: expert_level, label: Expert Level, width: 170 }
        - { column: keywords, label: Keywords, width: 200 }
        - { column: computer_program, label: Computer Program, width: 150 }
        - { column: project, label: Project, width: 180 }
        - { column: locations, label: Locations, width: 180 }
        - { cell: citation }
        - { cell: contributed }
    - name: Files
      table: files
      count_field: summary.files._n_results
      columns:
        - { cell: title, column: file, subtitle_column: description }
        - { column: format, label: Format, width: 90 }
        - { column: media_type, label: Media Type, width: 180 }
        - { column: size_bytes, label: File Size, width: 110, format: bytes }
        - { cell: citation }
        - { cell: contributed }
  extra_types: []
  # A filter per column with data (`text`: each text column as a facet;
  # `numeric`: each number column as a range; `exists`: With / Without Data),
  # found with the sidebar's filter search; they replaced the facets of the
  # legacy Advanced Search dropdowns (data type, expert level, project,
  # geographic and timescale terms) on 2026-11-13. Age: each object's
  # age_low..age_high in years BP (unit_conversions below), matching a record
  # whose range overlaps the one typed in Ma.
  filters:
    - { type: range, label: Age, field: summary._interval.age.range, unit: Ma, scale: 1.0e6, timescale: true, levels: [Contributions, Digital Objects] }
    - { type: text, label: Text }
    - { type: numeric, label: Numeric }
    - { type: exists, label: With / Without Data }
    # Every node's contribution filters (the contribution block's id, reference DOI, contributor, timestamp).
    - { type: facet, field: id, label: Contribution ID }
    - { type: facet, field: doi, label: Contribution DOI }
    - { type: facet, field: contributor, label: Contributor }
    - { type: range, field: summary.contribution.timestamp, label: Contributed On, date: true }
  # An object's ages are in its age_unit, Ma without one (the data model's
  # "Ma or age_unit"): in years BP in summary._num, and as one interval in
  # summary._interval.age (a side without a bound open).
  unit_conversions:
    - unit_column: age_unit
      columns: [age_low, age_high]
      bounds: [age_low, age_high]
      unit: years BP
      default_unit: Ma
      factors:
        { Ga: 1.0e9, Ma: 1.0e6, ka: 1.0e3, Ka: 1.0e3, Years BP: 1, Years Cal BP: 1,
          "Years AD (+/-)": -1, "Years Cal AD (+/-)": -1 }
      offsets: { "Years AD (+/-)": 1950, "Years Cal AD (+/-)": 1950 }
      interval: { name: age }

storage:
  bucket: erda

data_model:
  versions: ["1.0"]
  latest: "1.0"
  dir: erda/data_models

vocabularies:
  controlled: erda/controlled_vocabularies.json
  suggested: erda/suggested_vocabularies.json

hierarchy:
  - contribution
  - objects
  - files

doi:
  prefix: 10.7288/V4/ERDA

# Content pages (/<slug>, HTML in <node>/pages/<slug>.html); none yet.
pages: []

features:
  plugins: [sample-tiles]

# Legacy import (`fiesta legacy-inventory erda --out …`): the Perl CGI archive
# has no reachable er_* tables or index, so its public record pages are crawled.
# Owners: contributor display name -> er_users account by exact full name
# (reviewed in <out>/owner_mapping.json); `owner_names` overrides a name, and
# every published record still unmatched goes to `default_owner`.
legacy:
  kind: earthref-cgi
  source_id: legacy-erda
  base_url: https://earthref.org/ERDA
  max_id: 4900
  concurrency: 4
  users_index: er_users
  # Owner emails are never checked in: `owner_names` and the steward
  # (`default_owner`, which must resolve in er_users like any other owner) come
  # from the gitignored `<out>/owner_map.json` (`--owner-map`).
  owner_names: {}
  # Records with files over the download cap, or with files the legacy archive
  # has lost, import as metadata only (files rows kept, noted); a later run with
  # a higher --max-file-mb attaches the deferred files. 2741 is a test record.
  incomplete_records: metadata
  exclude_ids: [2741]

# Local fixtures only; never read during normal application startup.
development:
  seed_manifest: erda/seeds/manifest.yaml
