# Field-model catalogue: where each model GEOMAGIA's field-model pages offer
# (its field_models/catalog.py) is published openly, and how fetch_models.py
# turns it into the B-spline layout the plugin synthesises.
#
# Nothing here is a coefficient: the script downloads every file from its
# original public source, checks it against the sha256 below, converts it and
# writes the result to the node's storage (<prefix>field-models/). No model
# file is committed to this repository or taken from GEOMAGIA's own copies.
#
# archives: downloads shared by several models.
#   url      the public source, pinned to a commit/version where it has one
#   sha256   of the download; null where the host generates the archive per
#            request (its member hashes below are what is checked then)
#   format   zip | rar (needs bsdtar, libarchive) | file
# models: GEOMAGIA's catalogue order.
#   group    GEOMAGIA's dataset group (catalog.py DATASET_GROUPS)
#   author, year   the label "<name> — <author> et al. (<year>)"
#   legacy   listed under "Legacy models" (catalog.py LEGACY_MODELS)
#   source   {archive, member, sha256 of the member}; or {kalmag: ...} for
#            the University of Potsdam Kalmag service (one POST per model and
#            statistic when the script runs; its output is deterministic, so
#            the extracted file's sha256 is pinned too)
#   format   spline (as published) | ka-bp-spline (GGFSS70: 1950 - 1000 ka)
#            | epoch-matrix (Kalmag, pfm9k.2) | sha-dif | shawq-xlsx
#            -- every epoch format becomes a natural cubic interpolant
#   ensemble {source, format, kind}: members for the uncertainty bands
#   terms    the licence or terms as stated at the source ("none stated")
#   citation shown with the model in the UI and in every export

