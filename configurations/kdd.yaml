# FIESTA deployment configuration — KdD node
# (Partition coefficient database; data model fetched from the live
# kdd.earthref.org node, 2021-03-12.)

fiesta: 1
deployment: node

node:
  key: KdD
  slug: kdd
  title: GERM - Partition Coefficients Database (KdD)
  subtitle: >-
    Geochemical Earth Reference Model (GERM) partition coefficients from both experimental and empirical data for all types of rocks, minerals, and elements.
  color: "#bb4b1c" # Semantic UI "orange" in the legacy app (KDD lib/configs/portals.js)
  logo: logo.svg # configurations/kdd/assets/, on the FIESTA portal home
  links:
    website: https://earthref.org/KdD
    github_issues: https://github.com/earthref/KdD/issues

search:
  index: kdd
  # `columns` are each level's Summaries tiles (fiesta.search.grid). KdD has
  # no positions, geography, geology, ages or method codes, so its tiles are
  # the elements, phases and partition coefficients (2026-11-13).
  levels:
    - name: Contributions
      table: contribution
      columns:
        - { cell: record }
        - { cell: download }
        - { cell: links }
        - { cell: counts }
        - { cell: field, column: element, label: Elements, show: values, width: 160 }
        - cell: fields
          label: Phases
          show: values
          width: 200
          columns:
            - { column: minerals, label: Minerals }
            - { column: rock_types, label: Rocks }
        - cell: fields
          label: Kd
          show: range
          columns:
            - { column: kd, label: Kd }
            - { column: kd_low, label: Low }
            - { column: kd_high, label: High }
        - { cell: field, column: kd_types, label: Kd Types, show: values, width: 140 }
    - name: Partition Coefficients
      table: kds
      count_field: summary.kds._n_results
      columns:
        - { cell: record }
        - { cell: field, column: element, label: Element, width: 90 }
        - cell: fields
          label: Phases
          width: 200
          columns:
            - { column: minerals, label: Minerals }
            - { column: rock_types, label: Rocks }
        - cell: fields
          label: Kd
          columns:
            - { column: kd, label: Kd }
            - { column: kd_sigma, label: σ }
            - { column: kd_low, label: Low }
            - { column: kd_high, label: High }
        - cell: fields
          label: Definition
          width: 180
          columns:
            - { column: kd_types, label: Types }
            - { column: kd_definition, label: Definition }
  extra_types: []
  filters:
    # Every node's contribution filters (the contribution block's id, contributor, timestamp).
    - { type: facet, field: id, label: Contribution ID }
    - { type: facet, field: contributor, label: Contributor }
    - { type: range, field: summary.contribution.timestamp, label: Contributed On, date: true }

storage:
  bucket: kdd

data_model:
  versions: ["1.0"]
  latest: "1.0"
  dir: kdd/data_models

vocabularies:
  controlled: kdd/controlled_vocabularies.json

hierarchy:
  - contribution
  - kds

doi:
  prefix: 10.7288/V4/KDD

# Content pages (/<slug>, HTML in <node>/pages/<slug>.html); none yet.
pages: []

features:
  plugins: [sample-tiles, periodic-table]

# Plugin options (docs/plugins.md); the element column the periodic table counts.
plugins:
  periodic-table:
    table: kds
    column: element

# Legacy Meteor sources, read only by `fiesta legacy-inventory` (Phase M5/M6).
# Only the append-only archive bucket exists for KdD; private contributions are
# exported from the index.
legacy:
  source_id: legacy-kdd
  index: kdd
  buckets: [kdd-activated-contributions]
  users_index: er_users

# Local fixtures only; never read during normal application startup.
development:
  seed_manifest: kdd/seeds/manifest.yaml
