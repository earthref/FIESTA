# FIESTA deployment configuration — KdD node
# (Partition coefficient database; data model fetched from the live
# kdd.earthref.org node, 2021-03-12.)

fiesta: 1
deployment: node

node:
  key: KdD
  slug: kdd
  title: GERM - Partition Coefficients Database (KdD)
  subtitle: >-
    Geochemical Earth Reference Model (GERM) partition coefficients from both experimental and empirical data for all types of rocks, minerals, and elements.
  color: "#bb4b1c" # Semantic UI "orange" in the legacy app (KDD lib/configs/portals.js)
  logo: logo.svg # configurations/kdd/assets/: the node tile (header, portal home, favicon)
  logo_style: tile # tile: framed, drawn in the node color, named; full: the SVG as drawn
  links:
    website: https://earthref.org/KdD
    github_issues: https://github.com/earthref/KdD/issues

search:
  index: kdd
  # `columns` are each level's Summaries tiles (fiesta.search.grid). KdD has
  # no positions, geography, geology, ages or method codes, so its tiles are
  # the elements, phases and partition coefficients (2026-11-13).
  levels:
    - name: Contributions
      table: contribution
      columns:
        - { cell: record }
        - { cell: download }
        - { cell: links }
        - { cell: counts }
        - { cell: field, column: element, label: Elements, show: values, width: 160 }
        - cell: fields
          label: Phases
          show: values
          width: 200
          columns:
            - { column: minerals, label: Minerals }
            - { column: rock_types, label: Rocks }
        - cell: fields
          label: Kd
          show: range
          columns:
            - { column: kd, label: Kd }
            - { column: kd_low, label: Low }
            - { column: kd_high, label: High }
        - { cell: field, column: kd_types, label: Kd Types, show: values, width: 140 }
    - name: Partition Coefficients
      table: kds
      count_field: summary.kds._n_results
      columns:
        - { cell: record }
        - { cell: field, column: element, label: Element, width: 90 }
        - cell: fields
          label: Phases
          width: 200
          columns:
            - { column: minerals, label: Minerals }
            - { column: rock_types, label: Rocks }
        - cell: fields
          label: Kd
          columns:
            - { column: kd, label: Kd }
            - { column: kd_sigma, label: σ }
            - { column: kd_low, label: Low }
            - { column: kd_high, label: High }
        - cell: fields
          label: Definition
          width: 180
          columns:
            - { column: kd_types, label: Types }
            - { column: kd_definition, label: Definition }
  extra_types: []
  # A filter per column with data (`text`: each text column as a facet;
  # `numeric`: each number column as a range; `exists`: With / Without Data),
  # found with the sidebar's filter search (2026-11-13).
  filters:
    # The legacy KdD sidebar's Publication Year. Its other facets (rock types,
    # minerals, Kd definition and types) are data-model text columns, which
    # the `text` filter lists one by one.
    - { type: range, label: Publication Year, field: summary.contribution._reference.year }
    - { type: text, label: Text }
    - { type: numeric, label: Numeric }
    - { type: exists, label: With / Without Data }
    # Every node's contribution filters (the contribution block's id, reference DOI, contributor, reference authors, timestamp).
    - { type: facet, field: id, label: Contribution ID }
    - { type: facet, field: doi, label: Contribution DOI }
    - { type: facet, field: contributor, label: Contributor }
    - { type: facet, field: author, label: Author }
    - { type: range, field: summary.contribution.timestamp, label: Contributed On, date: true }
  # Filters kept at the top of the sidebar, in this order, whatever their
  # counts (one with no values shows disabled); the rest follow by count. A
  # rule's `levels` / `views` (empty = any) say where it applies; the most
  # specific matching rule wins. Names are sidebar labels as spelled above,
  # or a plugin filter's label (the periodic table's `label` option, by
  # default Periodic Table of Elements);
  # one with no filter is skipped.
  pinned_filters:
    - { filters: [Periodic Table of Elements, Publication Year, Author, Contributor] }

storage:
  bucket: kdd

data_model:
  versions: ["1.0"]
  latest: "1.0"
  dir: kdd/data_models

vocabularies:
  controlled: kdd/controlled_vocabularies.json

hierarchy:
  - contribution
  - kds

doi:
  prefix: 10.7288/V4/KDD

# Content pages (/<slug>, HTML in <node>/pages/<slug>.html); none yet.
pages: []

features:
  plugins: [sample-tiles, periodic-table, kd-plots]

# Plugin options (docs/plugins.md); the element column the periodic table counts.
plugins:
  periodic-table:
    table: kds
    column: element
  # Spider, Onuma and Kd-by-element plots (configurations/plugins/kd-plots); the defaults fit kds.
  kd-plots:
    levels: [Partition Coefficients]

# Legacy Meteor sources, read only by `fiesta legacy-inventory` (Phase M5/M6).
# Only the append-only archive bucket exists for KdD; private contributions are
# exported from the index.
legacy:
  source_id: legacy-kdd
  index: kdd
  buckets: [kdd-activated-contributions]
  users_index: er_users

# Local fixtures only; never read during normal application startup.
development:
  seed_manifest: kdd/seeds/manifest.yaml
