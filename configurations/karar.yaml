# FIESTA deployment configuration — KArAr node

fiesta: 1
deployment: node

node:
  key: KArAr
  slug: karar
  title: K/Ar and ⁴⁰Ar/³⁹Ar Data Repository (KArAr)
  subtitle: >-
    K/Ar and ⁴⁰Ar/³⁹Ar geochronology results including ages recalculated
    against community-agreed standards and constants.
  color: "#3030bb" # Semantic UI "blue" in the legacy app
  logo: logo.svg # configurations/karar/assets/, on the FIESTA portal home
  links:
    website: https://earthref.org/KArAr
    github_issues: https://github.com/earthref/KArAr/issues

search:
  index: karar
  # A record's geography, inherited by the records below that name it and
  # listed by the summary grid's Geography tile.
  geography:
    geographic: [continent_ocean, country, region, village_city, location, location_type, location_alternatives]
  # `columns` are each level's Summaries tiles (fiesta.search.grid). KArAr
  # has no paleointensity or citation columns, the age-spectrum plot draws
  # only specimens and experiments, and a sample's geology (sample-tiles
  # options below) is not passed down to its specimens; each level shows its
  # own irradiation, experiment or step columns instead (2026-11-13).
  levels:
    - name: Contributions
      table: contribution
      columns:
        - { cell: record }
        - { cell: download }
        - { cell: links }
        - { cell: counts }
        - { cell: map }
        - { cell: geo }
        - { cell: geology }
        - { cell: age }
        - cell: fields
          label: Experiments
          show: values
          columns:
            - { column: experiment_type, label: Type }
            - { column: extraction_method, label: Extraction }
            - { column: material_name, label: Material }
        - { cell: method_codes }
    - name: Samples
      table: samples
      count_field: summary.samples._n_results
      columns:
        - { cell: record }
        - { cell: map }
        - { cell: geo }
        - { cell: geology }
        - cell: fields
          label: Details
          columns:
            - { column: igsn, label: IGSN }
            - { column: dir_polarity, label: Polarity }
            - { column: elevation, label: Elevation }
        - { cell: method_codes }
    - name: Specimens
      table: specimens
      count_field: summary.specimens._n_results
      columns:
        - { cell: record }
        - { cell: map }
        - { cell: plot }
        - { cell: age }
        - cell: fields
          label: Irradiation
          width: 180
          columns:
            - { column: material_name, label: Material }
            - { column: j_value, label: J }
            - { column: stnd_name, label: Standard }
            - { column: is_flux_monitor, label: Flux Monitor }
        - { cell: geo }
        - { cell: method_codes }
    - name: Experiments
      table: experiments
      count_field: summary.experiments._n_results
      columns:
        - { cell: record }
        - { cell: map }
        - { cell: plot }
        - { cell: age }
        - cell: fields
          label: Method
          width: 180
          columns:
            - { column: experiment_type, label: Type }
            - { column: extraction_method, label: Extraction }
            - { column: age_calculation_method, label: Age From }
            - { column: age_n, label: N Steps }
        - { cell: geo }
        - { cell: method_codes }
    - name: Measurements
      table: measurements
      count_field: summary.measurements._n_results
      columns:
        - { cell: record }
        - { cell: map }
        - { cell: field, column: experiment, label: Experiment, width: 150 }
        - { cell: age }
        - cell: fields
          label: Step
          columns:
            - { column: temp, label: Temp }
            - { column: fraction_40ar_radiogenic, label: ⁴⁰Ar* }
            - { column: fraction_39ar_k, label: ³⁹Ar(K) }
        - cell: fields
          label: Intercepts
          columns:
            - { column: intercept_40ar, label: ⁴⁰Ar }
            - { column: intercept_39ar, label: ³⁹Ar }
            - { column: intercept_38ar, label: ³⁸Ar }
            - { column: intercept_37ar, label: ³⁷Ar }
            - { column: intercept_36ar, label: ³⁶Ar }
        - { cell: geo }
  extra_types: []
  # A filter per column with data (`text`: each text column, and a record's
  # inherited geography, as a facet; `numeric`: each number column as a
  # range; `exists`: With / Without Data), found with the sidebar's filter
  # search; they replaced the per-column facets on 2026-11-13. Age: each
  # row's age interval in years BP (unit_conversions below), matching a record
  # any of whose intervals overlaps the range typed in Ma.
  filters:
    - { type: range, label: Age, field: summary._interval.age.range, unit: Ma, scale: 1.0e6, timescale: true, levels: [Contributions, Samples, Specimens, Experiments] }
    - { type: text, label: Text }
    - { type: numeric, label: Numeric }
    - { type: exists, label: With / Without Data }
    # Every node's contribution filters (the contribution block's id, reference DOI, contributor, timestamp).
    - { type: facet, field: id, label: Contribution ID }
    - { type: facet, field: doi, label: Contribution DOI }
    - { type: facet, field: contributor, label: Contributor }
    - { type: range, field: summary.contribution.timestamp, label: Contributed On, date: true }
  # Ages in one unit (years BP) whatever their age_unit, as MagIC's: in
  # summary._num, and each specimen's / experiment's as one interval in
  # summary._interval.age (the Age filter, tile and sort): age_low..age_high,
  # a missing end age -/+ 2 x its sigma (external, else internal, else
  # analytical; all 1 sigma), a side with neither open.
  unit_conversions:
    - unit_column: age_unit
      columns: [age, age_low, age_high]
      scaled: [age_sigma_external, age_sigma_internal, age_sigma_analytical]
      bounds: [age_low, age_high]
      unit: years BP
      factors:
        { Ga: 1.0e9, Ma: 1.0e6, ka: 1.0e3, Ka: 1.0e3, Years BP: 1, Years Cal BP: 1,
          "Years AD (+/-)": -1, "Years Cal AD (+/-)": -1 }
      offsets: { "Years AD (+/-)": 1950, "Years Cal AD (+/-)": 1950 }
      interval:
        name: age
        value: age
        sigma: [age_sigma_external, age_sigma_internal, age_sigma_analytical]
        sigma_multiple: 2
  # Samples on another planetary body, by their location_type: they and their
  # specimens, ... are mapped on that body's globe, not Earth's.
  # Martian is left out: those samples are meteorites, mapped where found.
  bodies:
    column: location_type
    values: { Lunar: moon }

storage:
  bucket: karar

data_model:
  versions: ["1.0"]
  latest: "1.0"
  dir: karar/data_models

vocabularies:
  controlled: karar/controlled_vocabularies.json
  suggested: karar/suggested_vocabularies.json

hierarchy:
  - contribution
  - samples
  - specimens
  - experiments
  - measurements

doi:
  prefix: 10.7288/V4/KARAR

# Content pages (/<slug>, HTML in <node>/pages/<slug>.html); none yet.
pages: []

# Plugin options (one map per plugin, validated against its Options model;
# edited in the admin UI's Plugins tab).
plugins:
  plateau-calculations:
    # Plots draw the contributed ages; nothing is recalculated, so there are
    # no constants to set.
    experiment_levels: [Experiments]
    specimen_levels: [Specimens]
  # The Geology tile on KArAr's sample columns (the defaults are MagIC's).
  sample-tiles:
    geologic_class_columns: [material_classification]
    geologic_type_columns: [material]
    lithology_columns: [lithology]

features:
  plugins: [plateau-calculations, sample-tiles]

# Legacy Meteor sources, read only by `fiesta legacy-inventory` (Phase M5/M6).
# The public archive bucket comes first; `karar-contributions` is the latest-only
# mirror. Private contributions have no S3 object and are exported from the index.
legacy:
  source_id: legacy-karar
  index: karar
  buckets: [karar-activated-contributions, karar-contributions]
  users_index: er_users

# Local fixtures only; never read during normal application startup.
development:
  seed_manifest: karar/seeds/manifest.yaml
