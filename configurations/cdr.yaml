# FIESTA deployment configuration — CDR node

fiesta: 1
deployment: node

node:
  key: CDR
  slug: cdr
  title: Core Data Repository (CDR)
  subtitle: >-
    Archiving geological drilling samples multi-sensor track data for sediment
    and rock cores.
  color: "#e09f00" # Semantic UI "yellow" in the legacy app
  logo: logo.svg # configurations/cdr/assets/, on the FIESTA portal home
  links:
    website: https://earthref.org/CDR
    github_issues: https://github.com/earthref/CDR/issues

search:
  index: cdr
  # A record's geography, inherited by the records below that name it and
  # listed by the summary grid's Geography tile.
  geography:
    geographic: [continent_ocean, country, ocean_sea, region, village_city]
  # `columns` are each level's Summaries tiles (fiesta.search.grid). CDR has
  # no geology, age, intensity, method-code or citation data, so its tiles are
  # the cruise, core, section and measurement columns instead; Geography lives
  # on cores (2026-11-13). The plot tile is depth-plot's thumbnail, after the
  # map on contributions and cores as in legacy CDR.
  levels:
    - name: Contributions
      table: contribution
      columns:
        - { cell: record }
        - { cell: download }
        - { cell: links }
        - { cell: counts }
        - { cell: map }
        - { cell: plot }
        - cell: fields
          label: Cruises
          show: values
          columns:
            - { column: cruise, label: Cruise }
            - { column: research_vessel, label: Vessel }
            - { column: pis, label: PIs }
        - cell: fields
          label: Cores
          show: values
          columns:
            - { column: material, label: Material }
            - { column: method, label: Method }
        - cell: fields
          label: Depths
          show: range
          columns:
            - { column: length, label: Core Length }
            - { column: depth, label: Measured }
        - { cell: geo }
    - name: Cores
      table: cores
      count_field: summary.cores._n_results
      columns:
        - { cell: record }
        - { cell: map }
        - { cell: plot }
        - cell: fields
          label: Cruise
          columns:
            - { column: cruise, label: Cruise }
            - { column: research_vessel, label: Vessel }
            - { column: pis, label: PIs }
        - cell: fields
          label: Coring
          columns:
            - { column: material, label: Material }
            - { column: method, label: Method }
            - { column: length, label: Length }
            - { column: diameter, label: Diameter }
            - { column: mbs_top, label: Top Depth }
        - { cell: field, column: start_timestamp, label: Drilled, width: 130 }
        - { cell: geo }
    - name: Sections
      table: sections
      count_field: summary.sections._n_results
      columns:
        - { cell: record }
        - { cell: map }
        - cell: fields
          label: Interval
          columns:
            - { column: number, label: Number }
            - { column: type, label: Type }
            - { column: depth_top, label: Top }
            - { column: depth_bottom, label: Bottom }
            - { column: igsn, label: IGSN }
    - name: Measurements
      table: measurements
      count_field: summary.measurements._n_results
      columns:
        - { cell: record }
        - { cell: map }
        - cell: fields
          label: Depth
          columns:
            - { column: depth, label: Depth }
            - { column: mbs_corrected, label: Corrected }
        - cell: fields
          label: Physical Properties
          width: 190
          columns:
            - { column: gamma_density, label: Density }
            - { column: mag_susc_chi_mass, label: χ Mass }
            - { column: pwave_v, label: P-Wave }
            - { column: res, label: Resistivity }
            - { column: fp, label: Porosity }
        - cell: fields
          label: XRF
          columns:
            - { column: fe, label: Fe }
            - { column: ca, label: Ca }
            - { column: ti, label: Ti }
            - { column: k, label: K }
            - { column: sr, label: Sr }
  extra_types: []
  # A filter per column with data (`text`: each text column as a facet;
  # `numeric`: each number column as a range; `exists`: With / Without Data),
  # found with the sidebar's filter search; they replaced the legacy CDR
  # sidebar's per-column bucket filters (search.jsx) on 2026-11-13.
  filters:
    - { type: text, label: Text }
    - { type: numeric, label: Numeric }
    - { type: exists, label: With / Without Data }
    # Every node's contribution filters (the contribution block's id, reference DOI, contributor, timestamp).
    - { type: facet, field: id, label: Contribution ID }
    - { type: facet, field: doi, label: Contribution DOI }
    - { type: facet, field: contributor, label: Contributor }
    - { type: range, field: summary.contribution.timestamp, label: Contributed On, date: true }
  # The Map view's "Color by" menu, the same as MagIC's (no `bodies`: every core
  # is on Earth). A column is offered only on the levels whose table has it, so
  # until CDR's cores carry ages or magnetic columns the Cores map offers
  # Publication Year alone.
  map_colors:
    - { label: Publication Year, field: summary.contribution._reference.year }
    - label: Age
      field: age
      unit: Ma
      scale: 1.0e6
      log: true
      unit_column: age_unit
      unit_factors:
        { Ga: 1.0e9, Ma: 1.0e6, ka: 1.0e3, Ka: 1.0e3, Years BP: 1, Years Cal BP: 1,
          "Years AD (+/-)": -1, "Years Cal AD (+/-)": -1 }
      unit_offsets: { "Years AD (+/-)": 1950, "Years Cal AD (+/-)": 1950 }
    - { label: Paleointensity, field: int_abs, unit: μT, scale: 1.0e-6 }
    - { label: VADM, field: vadm, unit: ZAm², scale: 1.0e21 }
    - { label: Inclination, field: dir_inc, unit: "°" }
    - { label: VGP Latitude, field: vgp_lat, unit: "°" }
    - { label: Magnetic Moment, field: magn_moment, unit: Am², log: true }
    - { label: Mass Susceptibility, field: susc_chi_mass, unit: m³/kg, log: true }

storage:
  bucket: cdr

data_model:
  versions: ["1.0"]
  latest: "1.0"
  dir: cdr/data_models

vocabularies:
  controlled: cdr/controlled_vocabularies.json
  suggested: cdr/suggested_vocabularies.json

hierarchy:
  - contribution
  - cores
  - sections
  - measurements

doi:
  prefix: 10.7288/V4/CDR

# Content pages (/<slug>, HTML in <node>/pages/<slug>.html); none yet.
pages: []

# Plugin options (one map per plugin, validated against its Options model;
# edited in the admin UI's Plugins tab).
plugins:
  depth-plot:
    levels: [Cores]
    depth_columns: [mbs_corrected, depth]
    # Measurement tracks, matching the legacy seriesDefs (key, label, color).
    series:
      - { key: gamma_density, label: Gamma Density, color: "#1f77b4" }
      - { key: mag_susc_chi_mass, label: Mag Susc χmass, color: "#ff7f0e" }
      - { key: res, label: Resistivity (ohm-m), color: "#2ca02c" }
      - { key: pwave_v, label: P-wave Velocity (m/s), color: "#d62728" }
      - { key: fp, label: Porosity (frac), color: "#9467bd" }
      - { key: k, label: K (cps), color: "#8c564b" }
      - { key: ca, label: Ca (cps), color: "#e377c2" }
      - { key: ti, label: Ti (cps), color: "#7f7f7f" }
      - { key: fe, label: Fe (cps), color: "#bcbd22" }
      - { key: zr, label: Zr (cps), color: "#17becf" }

features:
  plugins: [depth-plot, sample-tiles]

# Legacy Meteor sources, read only by `fiesta legacy-inventory` (Phase M5/M6).
# CDR never had S3 buckets; every contribution is exported from the indexed tables.
# Decision 2026-09-28: import `cdr-3` only (665 contributions, bulk-loaded 2025-09-16,
# what the legacy search page shows). The 58 contributions in the `cdr` alias
# (`cdr-2`, model 1.0, overlapping ids with different content) are left behind.
# cdr-3 records say data model 3.0, but no 3.0 model exists; 1.0.json was extended
# with every table and column they carry, so they import as 1.0.
legacy:
  source_id: legacy-cdr
  index: cdr-3
  data_model_version: "1.0"
  # Every cdr-3 record carries the bulk loader's handle `cdr`, which is no account;
  # they go to the OSU-MGR steward account (decided 2026-09-29) through
  # `owner_handles` in the gitignored migration/cdr/owner_map.json, passed as
  # `legacy-inventory --owner-map` (owner emails never go in checked-in config).
  buckets: []
  users_index: er_users
  # #88 (HE0006/2JC, unactivated in cdr-3) holds XRF that OSU-MGR keeps under
  # moratorium; withheld until the curators answer (docs/OPERATOR_TODO.md, 2026-11-10).
  exclude_ids: [88]

# Local fixtures only; never read during normal application startup.
development:
  seed_manifest: cdr/seeds/manifest.yaml
