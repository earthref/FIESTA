name: fiesta-phase-m-test
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fiesta
      POSTGRES_PASSWORD: fiesta
      POSTGRES_DB: fiesta
    ports: ['127.0.0.1:25432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fiesta -d fiesta']
      interval: 2s
      retries: 30
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: fiesta
      MINIO_ROOT_PASSWORD: fiesta-secret
    ports: ['127.0.0.1:29000:9000']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 2s
      retries: 30
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ['127.0.0.1:29200:9200']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9200/_cluster/health']
      interval: 5s
      retries: 60

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:21025:1025", "127.0.0.1:28025:8025"]
  tests:
    profiles: [test]
    build:
      context: ./backend
      target: test
    volumes:
      - ./config:/config:ro
    environment:
      FIESTA_INTEGRATION: '1'
      FIESTA_ENVIRONMENT: development
      FIESTA_CONFIG_FILE: /config/fiesta.yaml
      FIESTA_DATABASE_URL: postgresql+asyncpg://fiesta:fiesta@postgres:5432/fiesta
      FIESTA_OPENSEARCH_URL: http://opensearch:9200
      FIESTA_S3_ENDPOINT: http://minio:9000
      FIESTA_S3_BUCKET: fiesta-test
      FIESTA_SMTP_HOST: mailpit
      FIESTA_SECRET_KEY: local-integration-test-key-at-least-32-characters
    depends_on:
      postgres: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      minio: {condition: service_healthy}
      mailpit: {condition: service_started}
    command: >-
      sh -c "fiesta init && fiesta seed && pytest -q && fiesta verify-storage"
networks:
  default:
    internal: true
