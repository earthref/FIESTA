[project]
name = "fiesta"
version = "0.1.0"
description = "FIESTA — Framework for Integrated Earth Science and Technology Applications"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "procrastinate>=2.9",
    "psycopg[binary]>=3.1",
    "opensearch-py[async]>=2.6",
    "aioboto3>=13.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "aiosmtplib>=3.0",
]

[project.scripts]
fiesta = "fiesta.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fiesta"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
